name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - android-port
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-pip build-essential libsdl2-dev libepoxy-dev

      - name: Prepare xboxrecomp
        run: |
          cmake -S xboxrecomp -B xboxrecomp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build xboxrecomp/build --parallel 4
          find xboxrecomp/build -type f -executable -name '*recomp*' -print

      - name: Generate recomp output
        run: |
          mkdir -p src/recomp/gen
          XBE=$(find . -type f -iname '*.xbe' | head -1)
          if [ -z "$XBE" ]; then
            echo "No XBE found in repository"
            exit 1
          fi
          TOOL=$(find xboxrecomp/build -type f -executable -name 'tools.recomp' -o -name 'recomp' | head -1)
          if [ -z "$TOOL" ]; then
            echo "recomp executable not found"
            find xboxrecomp/build -type f | head -100
            exit 1
          fi
          "$TOOL" --gen-dir src/recomp/gen "$XBE"

      - name: Configure build
        run: |
          mkdir -p build-android
          cd build-android
          cmake .. -DNFSU2_VULKAN=ON -DNFSU2_GEN_DIR=../src/recomp/gen

      - name: Build
        run: |
          cmake --build build-android --parallel 4

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: nfsu2-android-native
          path: build-android/**
