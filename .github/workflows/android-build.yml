name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - android-port
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Install Android packages
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.30.5"

      - name: Configure native Android build
        run: |
          mkdir -p build-android
          cd build-android
          cmake .. -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-35 -DNFSU2_VULKAN=ON

      - name: Build native library
        run: |
          cmake --build build-android --parallel 4

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: nfsu2-android-native
          path: build-android/**
