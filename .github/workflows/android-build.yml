name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - android-port
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-pip build-essential libsdl2-dev libepoxy-dev

      - name: Prepare xboxrecomp
        run: |
          cmake -S xboxrecomp -B xboxrecomp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build xboxrecomp/build --parallel 4

      - name: Generate recomp output
        run: |
          mkdir -p src/recomp/gen
          if find . -type f -iname '*.xbe' | grep -q .; then
            XBE=$(find . -type f -iname '*.xbe' | head -1)
            echo "Generating from $XBE"
            ./xboxrecomp/build/tools.recomp --gen-dir src/recomp/gen "$XBE"
          else
            echo "No XBE found in repository"
            echo "Upload NFSU2 XBE as build input before generating recomp code"
            exit 1
          fi

      - name: Configure build
        run: |
          mkdir -p build-android
          cd build-android
          cmake .. -DNFSU2_VULKAN=ON -DNFSU2_GEN_DIR=../src/recomp/gen

      - name: Build
        run: |
          cmake --build build-android --parallel 4

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: nfsu2-android-native
          path: build-android/**
