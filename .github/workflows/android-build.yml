name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - android-port
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.30.5"

      - name: Configure native Android build
        run: |
          mkdir -p build-android
          cd build-android
          cmake .. -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-35 -DNFSU2_VULKAN=ON

      - name: Build native library
        run: |
          cmake --build build-android --parallel 4

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: nfsu2-android-native
          path: build-android/**
