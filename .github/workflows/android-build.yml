name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - android-port
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 python3-pip build-essential

      - name: Generate recomp code
        run: |
          mkdir -p src/recomp/gen
          if [ -f src/recomp/gen/recomp_funcs.h ]; then
            echo "Generated code already present"
          else
            echo "Searching recomp generator"
            find xboxrecomp -type f \( -name "*recomp*" -o -name "*.py" \) | head -100
            echo "No generated recomp output available in repository"
            exit 1
          fi

      - name: Configure build
        run: |
          mkdir -p build-android
          cd build-android
          cmake .. -DNFSU2_VULKAN=ON

      - name: Build
        run: |
          cmake --build build-android --parallel 4

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: nfsu2-android-native
          path: build-android/**
